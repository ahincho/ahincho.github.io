name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies, build site and upload artifact
        uses: withastro/action@v3
        with:
          node-version: 22
        env:
          # Set this repository variable to the deployed Worker URL to enable
          # the public counters. Unset means the site builds without them.
          PUBLIC_COUNTER_URL: ${{ vars.PUBLIC_COUNTER_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
